<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll desk</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#14232b;--mute:#5d6f78;--line:#d3dde2;--accent:#2347a8;--ok:#1f7a4d;--bad:#b3261e;--wait:#8a6100}
@media(prefers-color-scheme:dark){:root{--bg:#10191e;--panel:#18252c;--ink:#e6eef1;--mute:#93a6af;--line:#2b3c45;--accent:#7ea0f5;--ok:#58c08a;--bad:#f2877f;--wait:#e0b44a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{padding:20px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
nav h1{font-size:18px;margin:0 8px 16px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
main{padding:20px;display:grid;gap:16px;align-content:start;max-width:1000px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
h2{font-size:16px;margin:0 0 12px}
form,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:150px}
input[dir=rtl]{text-align:right}
button.go{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
button.alt{background:none;color:var(--accent);border:1px solid var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:600}
td.ar{direction:rtl;text-align:right}
.SUCCESS{color:var(--ok);font-weight:600}.FAILED{color:var(--bad);font-weight:600}.PENDING{color:var(--wait);font-weight:600}
.err{color:var(--bad);font-weight:600}
pre{margin:0;max-height:220px;overflow:auto;background:var(--bg);padding:10px;border-radius:6px;font-size:12.5px}
.empty{color:var(--mute)}
section{display:none}section.on{display:block}
@media(max-width:700px){body{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;border:0}nav h1{width:100%}nav button{width:auto}}
</style>
</head>
<body>
<nav>
  <h1>Payroll desk</h1>
  <button class="on" data-s="employers">Employers</button>
  <button data-s="employees">Employees</button>
  <button data-s="pay">Pay salary</button>
  <button data-s="tx">Transactions</button>
</nav>
<main>
  <div class="panel">
    <section id="employers" class="on">
      <h2>Create employer</h2>
      <form data-act="createEmployer">
        <label>Name<input name="name" value="Gulf Star Trading" required></label>
        <label>Arabic name<input name="arabicName" dir="rtl" lang="ar" value="نجمة الخليج للتجارة" required></label>
        <label>Registration month<input name="registrationMonth" value="October" required></label>
        <label>Debit card<input name="debitCardNumber" value="4111111111111111" required></label>
        <button class="go">Create employer</button>
      </form>
      <h2>Find employer</h2>
      <form data-act="getEmployer"><label>Employer ID<input name="id" type="number" value="1" required></label><button class="go">Find employer</button></form>
    </section>

    <section id="employees">
      <h2>Employees of an employer</h2>
      <form data-act="listEmployees">
        <label>Employer ID<input name="id" type="number" value="1" required></label>
        <label>Name contains<input name="q" placeholder="rahul"></label>
        <button class="go">Show employees</button>
      </form>
      <h2>Register employee</h2>
      <form data-act="addEmployee">
        <label>Employer ID<input name="id" type="number" value="1" required></label>
        <label>Name<input name="name" value="Sara Ahmed" required></label>
        <label>Credit account<input name="creditAccountNumber" value="9876543299" required></label>
        <label>Monthly salary<input name="monthSalaryAmount" type="number" step="0.01" value="42000.50" required></label>
        <button class="go">Register employee</button>
      </form>
      <h2>Find employee</h2>
      <form data-act="getEmployee"><label>Employee ID<input name="id" type="number" value="1" required></label><button class="go">Find employee</button></form>
    </section>

    <section id="pay">
      <h2>Pay monthly salary</h2>
      <form data-act="pay">
        <label>Employer ID<input name="employerId" type="number" value="1" required></label>
        <label>Employee ID<input name="employeeId" type="number" value="4" required></label>
        <button class="go">Pay salary</button>
      </form>
      <p class="empty">Even employee IDs always fail and odd IDs succeed, because the payment is simulated.</p>
    </section>

    <section id="tx">
      <h2>Transactions</h2>
      <form data-act="txAll"><button class="go">Show all</button></form>
      <form data-act="txDate"><label>Date<input name="date" type="date" required></label><button class="go alt">Filter by date</button></form>
      <form data-act="txRange"><label>From<input name="from" type="date" required></label><label>To<input name="to" type="date" required></label><button class="go alt">Filter by range</button></form>
      <form data-act="txEmployer"><label>Employer ID<input name="id" type="number" value="1" required></label><button class="go alt">By employer</button></form>
      <form data-act="txEmployee"><label>Employee ID<input name="id" type="number" value="1" required></label><button class="go alt">By employee</button></form>
    </section>
  </div>

  <div class="panel"><h2>Result</h2><div class="tbl" id="result"><span class="empty">Run a request to see results here.</span></div></div>
  <div class="panel"><h2 id="logTitle">Raw response</h2><pre id="log">No request yet.</pre></div>
</main>
<script>
// Same origin when served by Spring Boot (port 8082); otherwise (Live Server, file://) call the backend directly
const BASE = location.port === '8082' ? '' : 'http://localhost:8082';
const $ = id => document.getElementById(id);
const json = (m, b) => ({ method: m, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
const num = v => v === '' ? v : Number(v);

const actions = {
  createEmployer: f => ['/api/employers', json('POST', f)],
  getEmployer: f => ['/api/employers/' + f.id],
  listEmployees: f => f.q
    ? ['/api/employers/' + f.id + '/employees/search?name=' + encodeURIComponent(f.q)]
    : ['/api/employers/' + f.id + '/employees'],
  addEmployee: f => ['/api/employers/' + f.id + '/employees',
    json('POST', { name: f.name, creditAccountNumber: f.creditAccountNumber, monthSalaryAmount: num(f.monthSalaryAmount) })],
  getEmployee: f => ['/api/employees/' + f.id],
  pay: f => ['/api/transactions/pay', json('POST', { employerId: num(f.employerId), employeeId: num(f.employeeId) })],
  txAll: () => ['/api/transactions'],
  txDate: f => ['/api/transactions?date=' + f.date],
  txRange: f => ['/api/transactions?from=' + f.from + '&to=' + f.to],
  txEmployer: f => ['/api/employers/' + f.id + '/transactions'],
  txEmployee: f => ['/api/employees/' + f.id + '/transactions']
};

async function call(path, opts) {
  const method = (opts && opts.method) || 'GET';
  try {
    const res = await fetch(BASE + path, opts);
    const data = await res.json().catch(() => null);
    $('logTitle').textContent = method + ' ' + path + ' \u2014 ' + res.status;
    $('log').textContent = JSON.stringify(data, null, 2);
    render(data, res.ok);
  } catch (e) {
    $('logTitle').textContent = method + ' ' + path + ' \u2014 no response';
    $('log').textContent = String(e);
    $('result').innerHTML = '<span class="err">Cannot reach the server. Check that the app is running on port 8082.</span>';
  }
}

function esc(v) { return String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render(data, ok) {
  const box = $('result');
  if (!ok) { box.innerHTML = '<span class="err">' + esc(data && data.message || 'Request failed') + '</span>'; return; }
  const rows = Array.isArray(data) ? data : [data];
  if (!rows.length) { box.innerHTML = '<span class="empty">No records found.</span>'; return; }
  const cols = Object.keys(rows[0]);
  const canStop = 'active' in rows[0];
  let h = '<table><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + (canStop ? '<th></th>' : '') + '</tr>';
  for (const r of rows) {
    h += '<tr>' + cols.map(c => {
      const cls = c === 'status' ? r[c] : c === 'arabicName' ? 'ar' : '';
      return '<td class="' + cls + '">' + esc(r[c]) + '</td>';
    }).join('');
    if (canStop) h += '<td>' + (r.active ? '<button class="go alt" data-stop="' + r.id + '">Deregister</button>' : '') + '</td>';
    h += '</tr>';
  }
  box.innerHTML = h + '</table>';
}

document.querySelectorAll('form').forEach(form => form.addEventListener('submit', e => {
  e.preventDefault();
  const [path, opts] = actions[form.dataset.act](Object.fromEntries(new FormData(form)));
  call(path, opts);
}));

$('result').addEventListener('click', e => {
  const id = e.target.dataset.stop;
  if (id && confirm('Deregister employee ' + id + '?')) call('/api/employees/' + id + '/deregister', { method: 'PUT' });
});

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button, section').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  $(b.dataset.s).classList.add('on');
}));
</script>
</body>
</html>
